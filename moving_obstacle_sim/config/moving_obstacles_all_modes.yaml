obstacles:
  - name: line_box_1
    enabled: true
    shape: {type: box, mass: 2.5, box_size: [0.5, 0.5, 0.8], color_rgba: [0.9, 0.2, 0.2, 1.0]}
    pose: {xyz: [2.0, -3.0, 0.4], rpy: [0.0, 0.0, 0.0]}
    motion:
      enabled: true
      type: line
      speed: 0.6
      mode: ping_pong
      align_yaw: true
      z_lock: true
      bounds: {enabled: true, x_min: -6.0, x_max: 6.0, y_min: -6.0, y_max: 6.0}
      line: {p0: [2.0, -4.5], p1: [2.0, -1.5]}

  - name: line_box_2
    enabled: true
    shape: {type: box, mass: 2.2, box_size: [0.5, 0.4, 0.7], color_rgba: [0.8, 0.35, 0.25, 1.0]}
    pose: {xyz: [3.5, -3.0, 0.35], rpy: [0.0, 0.0, 0.0]}
    motion:
      enabled: true
      type: line
      speed: 0.9
      mode: loop
      align_yaw: true
      z_lock: true
      bounds: {enabled: true, x_min: -6.0, x_max: 6.0, y_min: -6.0, y_max: 6.0}
      line: {p0: [3.5, -4.5], p1: [3.5, -1.5]}

  - name: sine_cyl_1
    enabled: true
    shape: {type: cylinder, mass: 2.0, radius: 0.23, length: 1.0, color_rgba: [0.15, 0.8, 0.3, 1.0]}
    pose: {xyz: [-4.0, -1.0, 0.5], rpy: [0.0, 0.0, 0.0]}
    motion:
      enabled: true
      type: sine
      speed: 0.65
      mode: loop
      align_yaw: true
      z_lock: true
      bounds: {enabled: true, x_min: -6.0, x_max: 6.0, y_min: -6.0, y_max: 6.0}
      sine: {axis: x, x_min: -5.5, x_max: -1.0, center: -1.0, amplitude: 0.9, wavelength: 2.5, phase: 0.0}

  - name: sine_cyl_2
    enabled: true
    shape: {type: cylinder, mass: 2.0, radius: 0.2, length: 0.9, color_rgba: [0.2, 0.7, 0.55, 1.0]}
    pose: {xyz: [-4.0, 1.8, 0.45], rpy: [0.0, 0.0, 0.0]}
    motion:
      enabled: true
      type: sine
      speed: 0.5
      mode: ping_pong
      align_yaw: true
      z_lock: true
      bounds: {enabled: true, x_min: -6.0, x_max: 6.0, y_min: -6.0, y_max: 6.0}
      sine: {axis: y, y_min: 0.5, y_max: 4.0, center: -4.0, amplitude: 0.8, wavelength: 2.8, phase: 0.3}

  - name: circle_sphere_1
    enabled: true
    shape: {type: sphere, mass: 1.5, radius: 0.3, color_rgba: [0.15, 0.35, 0.95, 1.0]}
    pose: {xyz: [0.0, 3.0, 0.3], rpy: [0.0, 0.0, 0.0]}
    motion:
      enabled: true
      type: circle
      speed: 0.8
      mode: loop
      align_yaw: true
      z_lock: true
      bounds: {enabled: true, x_min: -6.0, x_max: 6.0, y_min: -6.0, y_max: 6.0}
      circle: {center: [0.0, 3.0], radius: 1.6, clockwise: false, theta0: 0.0}

  - name: circle_sphere_2
    enabled: true
    shape: {type: sphere, mass: 1.2, radius: 0.25, color_rgba: [0.2, 0.55, 0.95, 1.0]}
    pose: {xyz: [0.0, -3.2, 0.25], rpy: [0.0, 0.0, 0.0]}
    motion:
      enabled: true
      type: circle
      speed: 0.9
      mode: loop
      align_yaw: true
      z_lock: true
      bounds: {enabled: true, x_min: -6.0, x_max: 6.0, y_min: -6.0, y_max: 6.0}
      circle: {center: [0.0, -3.2], radius: 1.4, clockwise: true, theta0: 1.57}

  - name: ellipse_box_1
    enabled: true
    shape: {type: box, mass: 2.8, box_size: [0.45, 0.45, 0.9], color_rgba: [0.95, 0.8, 0.15, 1.0]}
    pose: {xyz: [4.0, 2.0, 0.45], rpy: [0.0, 0.0, 0.0]}
    motion:
      enabled: true
      type: ellipse
      speed: 0.65
      mode: loop
      align_yaw: true
      z_lock: true
      bounds: {enabled: true, x_min: -6.0, x_max: 6.0, y_min: -6.0, y_max: 6.0}
      ellipse: {center: [4.0, 2.0], a: 1.8, b: 0.9, yaw: 0.4, clockwise: false, theta0: 0.0}

  - name: ellipse_box_2
    enabled: true
    shape: {type: box, mass: 2.6, box_size: [0.45, 0.5, 0.8], color_rgba: [0.92, 0.6, 0.2, 1.0]}
    pose: {xyz: [4.0, -1.8, 0.4], rpy: [0.0, 0.0, 0.0]}
    motion:
      enabled: true
      type: ellipse
      speed: 0.7
      mode: ping_pong
      align_yaw: true
      z_lock: true
      bounds: {enabled: true, x_min: -6.0, x_max: 6.0, y_min: -6.0, y_max: 6.0}
      ellipse: {center: [4.0, -1.8], a: 1.5, b: 0.7, yaw: -0.3, clockwise: true, theta0: 0.3}

  - name: polygon_cyl_1
    enabled: true
    shape: {type: cylinder, mass: 2.0, radius: 0.2, length: 1.0, color_rgba: [0.95, 0.6, 0.1, 1.0]}
    pose: {xyz: [-1.5, 2.5, 0.5], rpy: [0.0, 0.0, 0.0]}
    motion:
      enabled: true
      type: polygon
      speed: 0.75
      mode: ping_pong
      align_yaw: true
      z_lock: true
      bounds: {enabled: true, x_min: -6.0, x_max: 6.0, y_min: -6.0, y_max: 6.0}
      polygon:
        points: [[-1.5, 2.5], [-0.2, 3.8], [1.0, 2.5], [0.3, 1.1], [-1.0, 1.2]]
        close_loop: true

  - name: static_box_1
    enabled: true
    shape: {type: box, mass: 4.0, box_size: [1.2, 0.8, 1.0], color_rgba: [0.8, 0.8, 0.8, 1.0]}
    pose: {xyz: [0.0, 0.0, 0.5], rpy: [0.0, 0.0, 0.0]}
    motion:
      enabled: false
      type: static
      speed: 0.0
      mode: once
      align_yaw: false
      z_lock: true
      bounds: {enabled: false, x_min: -6.0, x_max: 6.0, y_min: -6.0, y_max: 6.0}
